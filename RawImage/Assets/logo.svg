<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradient similar to Adobe style -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bd93f9"/>
      <stop offset="100%" style="stop-color:#6272a4"/>
    </linearGradient>
    <!-- Subtle inner shadow -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="url(#bgGradient)"/>

  <!-- Subtle highlight on top-left -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- "Ri" text -->
  <text x="128" y="175"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="bold"
        font-size="140"
        fill="#f8f8f2"
        text-anchor="middle"
        letter-spacing="-8">Ri</text>
</svg>
